spring.application.name=sall_boucherie
# ==============================
# APPLICATION

# ==============================
# BASE DE DONNÉES (PostgreSQL)
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/boucherie_db
spring.datasource.username=postgres
spring.datasource.password=MonNouveauMotDePasse123
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================
# JWT
# ==============================
jwt.secret=boucherieModerneSecretKey2024SuperLongKeyPourLaSécurité
jwt.expiration=86400000

# ==============================
# SWAGGER UI
# ==============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==============================
# SERVEUR
# ==============================
server.port=8080
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaKet - Ajouter un Produit ➕</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api-service.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/shop.js" defer></script>
</head>
<body>
    <header>
    <div class="header-brand">
        <button type="button" 
                onclick="globalThis.location.href='gestion-boutique.html'" 
                style="background:none; border:none; font-size:24px; cursor:pointer;" 
                aria-label="Retour à la boutique">
            ⬅️
        </button>
        <h2>Nouvel Article</h2>
    </div>
</header>

<main class="container">
    <section class="card" style="max-width: 600px; margin: 20px auto;">
        <form id="product-form" onsubmit="globalThis.handleCreateProduct(event)">
            
            <div class="form-group">
                <label for="p-name">Nom du produit</label>
                <input type="text" id="p-name" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="p-desc">Description</label>
                <textarea id="p-desc" class="form-control" rows="3"></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label for="p-price">Prix (FCFA)</label>
                    <input type="number" id="p-price" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="p-stock">Stock disponible</label>
                    <input type="number" id="p-stock" class="form-control" value="1" required>
                </div>
            </div>

            <div class="form-group">
                <label for="p-category">Catégorie</label>
                <select id="p-category" class="form-control" onchange="globalThis.onCategoryChange(this.value)" required>
                    <option value="">Chargement...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="p-image">Lien de l'image (URL)</label>
                <input type="url" id="p-image" class="form-control">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; padding: 15px; font-size: 16px;">🚀 Mettre en vente</button>
        </form>
    </section>
</main>

    <script>
        globalThis.onload = async () => {
            if (typeof globalThis.loadCategoriesForForm === 'function') {
                await globalThis.loadCategoriesForForm();
            }
        };
    </script>
</body>
</html>

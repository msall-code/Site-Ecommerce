<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaKet - Administration 🛠️</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api-service.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/admin.js" defer></script>
</head>
<body>
    <header>
        <div class="header-brand">
            <img src="../Maket.png" alt="MaKet Logo" class="logo-admin">
            <h2>MaKet Admin Panel</h2>
        </div>
        <button type="button" onclick="globalThis.logout()" class="btn-danger">👋 Déconnexion</button>
    </header>

    <main class="container" style="max-width: 100%; padding: 20px;">
        <div class="welcome-container">
            <h1 class="welcome-title">Tableau de Bord Admin</h1>
            <p class="welcome-subtitle">Structurez le catalogue et affectez vos modèles de contraintes.</p>
        </div>

        <div class="admin-three-cols">
            <section class="card admin-card">
                <h3 class="card-title">📂 Explorateur de Catégories</h3>
                <div id="category-breadcrumb" class="breadcrumb-container"></div>
                
                <form onsubmit="event.preventDefault(); globalThis.createCategory();" style="display: flex; gap: 8px; margin-bottom: 15px;">
                    <input type="text" id="new-category-name" placeholder="Nom de catégorie..." class="form-control" required>
                    <button type="submit" class="btn-primary">➕</button>
                </form>

                <ul id="category-list" class="scrollable-list"></ul>
            </section>

            <section class="card admin-card" style="border-top-color: #f59e0b;">
                <h3 class="card-title">📏 Bibliothèque & Affectation</h3>
                
                <div class="library-creator" style="background: #fffbeb; padding: 15px; border-radius: 12px; border: 1px solid #fef3c7;">
                    <p class="section-subtitle" style="margin-bottom: 10px; color: #b45309;">Créer un modèle global</p>
                    <div style="display: grid; gap: 8px;">
                        <input type="text" id="lib-const-name" placeholder="Nom (ex: Matière, Couleur)" class="form-control">
                        <select id="lib-const-type" class="form-control">
                            <option value="TEXT">Texte libre</option>
                            <option value="NUMBER">Numérique</option>
                            <option value="SELECT">Liste de choix</option>
                        </select>
                        <button onclick="globalThis.createGlobalConstraint()" class="btn-primary" style="background:#f59e0b; border:none;">Ajouter à la bibliothèque</button>
                    </div>
                </div>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

                <div id="assignment-zone">
                    <p class="section-subtitle">Affecter à : <strong id="active-cat-display" style="color:var(--primary)">Sélectionnez une catégorie</strong></p>
                    <div id="global-constraints-library" class="scrollable-list" style="margin-top:10px;">
                        </div>
                </div>
            </section>

            <section class="card admin-card" style="border-top-color: var(--secondary);">
                <h3 class="card-title">👥 Gestion des Utilisateurs</h3>
                <div id="user-list" class="scrollable-list"></div>
            </section>
        </div>
    </main>
</body>
</html>
